name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: FreeBSD
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: zig build test

      - name: Build
        run: zig build

      - name: Smoke test
        run: sh test/smoke-test.sh
